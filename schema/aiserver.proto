    WriteShellStdinSuccess success = 1;
    WriteShellStdinError error = 2;
  }
}

message WriteShellStdinSuccess {
  uint32 shell_id = 1;
  uint32 terminal_file_length_before_input_written = 2;
}

message WriteShellStdinToolCall {
  WriteShellStdinArgs args = 1;
  WriteShellStdinResult result = 2;
}

message XSearchArgs {
  string query = 1;
  optional string from_date = 2;
  optional string to_date = 3;
  repeated string allowed_x_handles = 4;
  repeated string excluded_x_handles = 5;
}

message XSearchCitation {
  string url = 1;
  string title = 2;
}

message XSearchError {
  string error = 1;
}

message XSearchRejected {
  string reason = 1;
}

message XSearchResult {
  oneof result {
    XSearchSuccess success = 1;
    XSearchError error = 2;
    XSearchRejected rejected = 3;
  }
}

message XSearchSuccess {
  string answer = 1;
  repeated XSearchCitation citations = 2;
}

message XSearchToolCall {
  XSearchArgs args = 1;
  XSearchResult result = 2;
}

message XaiCommerceBearerCredential {
  string token = 1;
  string edge_base_url = 2;
  XaiCommerceBearerTokenSource token_source = 3;
  uint32 expires_in_seconds = 4;
  string asset_server_base_url = 5;
  string country = 6;
}

message XaiCommerceBearerRefusal {
  XaiCommerceBearerRefusalReason reason = 1;
  string message = 2;
}
