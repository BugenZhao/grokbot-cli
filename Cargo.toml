[package]
name = "grokbot"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
hex = "0.4.3"
humantime = "2.4.0"
libc = "0.2.191"
open = "5.4.4"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls", "http2", "system-proxy"] }
security-framework = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.10"
sha2 = "0.10"
toml = "1.1.8"
uuid = { version = "1.28.0", features = ["v4"] }
